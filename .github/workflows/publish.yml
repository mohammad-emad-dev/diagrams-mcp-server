name: Publish

# Runs on version tags or manual recovery of an existing tag. Push with:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the version in package.json (without the "v").

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to recover (e.g. v0.8.0)"
        required: true
        type: string
        default: "v0.11.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SELECTED_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        env:
          TAG_TO_CHECK: ${{ env.SELECTED_TAG }}
        run: |
          if ! [[ "$TAG_TO_CHECK" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG_TO_CHECK'. Expected exact format vN.N.N (e.g. v0.8.0)."
            exit 1
          fi
          echo "Tag '$TAG_TO_CHECK' format is valid."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.SELECTED_TAG }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json version
        env:
          EXPECTED_TAG: ${{ env.SELECTED_TAG }}
        run: |
          TAG_VERSION="${EXPECTED_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $EXPECTED_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check if version already published
        id: published
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version --prefer-online 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION is already on npm — npm publish will skip; MCP registration is checked separately."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if MCP version already registered
        id: mcp_published
        run: |
          MCP_NAME="$(node -p "require('./server.json').name")"
          MCP_VERSION="$(node -p "require('./server.json').version")"
          ENCODED_NAME="$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$MCP_NAME")"
          ENCODED_VERSION="$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$MCP_VERSION")"
          REG_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${ENCODED_VERSION}"
          HTTP_CODE="$(curl -sS -o /tmp/mcp-response.json -w "%{http_code}" "$REG_URL")"
          if [ "$HTTP_CODE" = "200" ]; then
            REG_NAME="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mcp-response.json','utf8')).server.name")"
            REG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/mcp-response.json','utf8')).server.version")"
            if [ "$REG_NAME" != "$MCP_NAME" ] || [ "$REG_VERSION" != "$MCP_VERSION" ]; then
              echo "Registry 200 response mismatch: expected $MCP_NAME@$MCP_VERSION, got $REG_NAME@$REG_VERSION"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "MCP $MCP_NAME@$MCP_VERSION is already registered — MCP publish steps will skip."
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "MCP $MCP_NAME@$MCP_VERSION not found in registry — MCP publish steps will run."
          else
            echo "Failed to check MCP registry: HTTP $HTTP_CODE for $REG_URL"
            cat /tmp/mcp-response.json
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit fresh publication dependencies
        if: steps.published.outputs.exists != 'true'
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify entry point runs
        run: node dist/index.js --help

      # Same hermetic setup as CI: no renderers installed, no network
      # rendering; the suite runs with stubbed CLIs.
      - name: Test
        run: npm test
        env:
          DISABLE_REMOTE_PLANTUML: "true"

      - name: Prepare real local renderers
        if: steps.published.outputs.exists != 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
          RENDERERS="$RUNNER_TEMP/diagrams-release-renderers"
          mkdir -p "$RENDERERS/bin"
          npm install --prefix "$RENDERERS" @mermaid-js/mermaid-cli@12.0.0 --ignore-scripts --no-audit --no-fund
          curl -fsSL "https://github.com/plantuml/plantuml/releases/download/v1.2026.9/plantuml-java8-1.2026.9.jar" -o "$RENDERERS/plantuml.jar"
          echo "9de63b51b10517b783253e0964d1db9b574506b70ea2aa8c3fa107ac17db8f06  $RENDERERS/plantuml.jar" | sha256sum -c -
          printf '%s\n' '{"args":["--no-sandbox"]}' > "$RENDERERS/puppeteer.json"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RENDERERS/plantuml.jar" > "$RENDERERS/bin/plantuml"
          printf '#!/usr/bin/env bash\nexec node "%s" -p "%s" "$@"\n' "$RENDERERS/node_modules/@mermaid-js/mermaid-cli/src/cli.js" "$RENDERERS/puppeteer.json" > "$RENDERERS/bin/mmdc"
          chmod +x "$RENDERERS/bin/plantuml" "$RENDERERS/bin/mmdc"
          CHROME="$(command -v google-chrome || true)"
          test -n "$CHROME" || { echo "Google Chrome not found"; exit 1; }
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "$RENDERERS/bin" >> "$GITHUB_PATH"
          "$RENDERERS/bin/plantuml" -version
          "$RENDERERS/bin/mmdc" --version

      - name: Verify clean packaged install with real renderers
        if: steps.published.outputs.exists != 'true'
        env:
          DISABLE_REMOTE_PLANTUML: "true"
        run: |
          ARTIFACTS="$RUNNER_TEMP/diagrams-release-artifacts"
          CONSUMER="$RUNNER_TEMP/diagrams-release-consumer"
          mkdir -p "$ARTIFACTS" "$CONSUMER"
          npm pack --ignore-scripts --json --pack-destination "$ARTIFACTS" > "$ARTIFACTS/pack.json"
          node -e "const p=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0]; console.log(JSON.stringify({filename:p.filename,integrity:p.integrity,files:p.entryCount}))" "$ARTIFACTS/pack.json"
          FILENAME="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$ARTIFACTS/pack.json")"
          TARBALL="$ARTIFACTS/$FILENAME"
          npm install --prefix "$CONSUMER" "$TARBALL" --omit=dev --ignore-scripts --no-audit --no-fund
          npm audit --prefix "$CONSUMER" --omit=dev
          npm run probe:package -- "$CONSUMER"
          echo "RELEASE_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish verified tarball to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish "$RELEASE_TARBALL"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm version visibility before MCP registration
        if: steps.mcp_published.outputs.exists != 'true'
        timeout-minutes: 12
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if VISIBLE_VERSION="$(npm view "$PKG_NAME@$PKG_VERSION" version --prefer-online 2>/dev/null)" && [ "$VISIBLE_VERSION" = "$PKG_VERSION" ]; then
              echo "npm $PKG_NAME@$PKG_VERSION is visible."
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "npm $PKG_NAME@$PKG_VERSION is still unavailable after 30 checks. Recover this tag after npm processing completes."
              exit 1
            fi
            echo "Waiting for npm processing: visibility check $attempt of 30."
            sleep 20
          done

      - name: Download mcp-publisher
        if: steps.mcp_published.outputs.exists != 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar xz -f mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.mcp_published.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.mcp_published.outputs.exists != 'true'
        run: |
          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "MCP publish attempt $attempt of $max_attempts..."
            if ./mcp-publisher publish; then
              echo "MCP publish succeeded on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "MCP publish failed after $max_attempts attempts."
              exit 1
            fi
            echo "MCP publish attempt $attempt failed; retrying in 15s..."
            sleep 15
            attempt=$((attempt + 1))
          done
