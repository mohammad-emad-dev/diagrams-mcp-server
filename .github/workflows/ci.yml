name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify entry point runs
        run: node dist/index.js --help

      # No global renderers (mmdc/plantuml) are installed and no
      # network-based rendering is used: diagrams_render is covered by
      # unit tests with stubbed CLIs, and the MCP integration test only
      # verifies its discovery. Remote PlantUML is disabled as
      # belt-and-braces so the suite stays hermetic.
      - name: Test
        run: npm test
        env:
          DISABLE_REMOTE_PLANTUML: "true"
